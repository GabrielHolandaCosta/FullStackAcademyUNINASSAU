{% extends 'base.html' %}

{% block title %}E-mail Enviado{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm p-4">
            <div class="alert alert-success text-center" role="alert">
                <i class="fas fa-check-circle fa-3x mb-3"></i>
                <h4 class="alert-heading">E-mail Enviado!</h4>
                <p>Enviamos instruções para recuperação de senha para o e-mail informado.</p>
                <p class="mb-0">Verifique sua caixa de entrada e siga as instruções.</p>
            </div>
            <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="btn btn-primary">
                    <i class="fas fa-arrow-left"></i> Voltar para o login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
