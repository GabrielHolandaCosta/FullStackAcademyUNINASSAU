{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin{% endblock %}</title>
  <!-- AdminLTE via CDN (CSS) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="{% static 'css/custom_admin.css' %}">
  {% block extrahead %}{% endblock %}
</head>
<body class="hold-transition dark-mode sidebar-mini layout-fixed">
<div class="wrapper">
  <!-- Navbar -->
  <nav class="main-header navbar navbar-expand navbar-dark">
    <a class="navbar-brand" href="/admin/">Painel Administrativo – Gabriel Holanda</a>
  </nav>
  <!-- Sidebar + Content -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="/admin/" class="brand-link text-center">
      <img src="{% static 'img/logo_small.png' %}" alt="Logo" class="brand-image img-circle elevation-3" style="opacity:.8">
      <span class="brand-text font-weight-light">Gestão Empresa</span>
    </a>
    <div class="sidebar">
      <!-- search -->
      <div class="form-inline my-2 mx-2">
        <form action="/admin/auth/user/">
          <input class="form-control form-control-sidebar" type="search" placeholder="Pesquisar" aria-label="Search">
        </form>
      </div>
      {% block sidebar %}{% endblock %}
    </div>
  </aside>
  <div class="content-wrapper" style="min-height: 600px;">
    <section class="content">
      <div class="container-fluid pt-3">
        {% block content %}{% block branding %}{% endblock %}{% endblock %}
      </div>
    </section>
  </div>
  <footer class="main-footer">
    <div class="float-right d-none d-sm-inline">Custom Admin - Dark</div>
    <strong>© 2025 - Projeto</strong>
  </footer>
</div>
<!-- AdminLTE JS -->
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
</body>
</html>
