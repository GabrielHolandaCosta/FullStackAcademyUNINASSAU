<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="#">Gestão Empresa</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'perfil' %}">Perfil</a>
                <a class="nav-link" href="{% url 'logout' %}">Sair</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-5">
        <div class="alert alert-success">
            <h2>Bem-vindo à Área do Usuário</h2>
            <p>Olá, <strong>{{ user.username }}</strong>! Você está logado como <strong>Usuário Comum</strong>.</p>
        </div>
        
        <div class="card">
            <div class="card-body">
                <h3 class="card-title">Funcionalidades Disponíveis</h3>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">Visualizar informações pessoais</li>
                    <li class="list-group-item">Atualizar perfil</li>
                    <li class="list-group-item">Acessar recursos básicos</li>
                </ul>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
